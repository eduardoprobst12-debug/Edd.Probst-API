<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mural de Publicações</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Meu Mural de Publicações</h1>
    <p>Consulte postagens de uma API pública de forma rápida e dinâmica</p>
  </header>

  <main>
    <div class="controles">
      <button id="btn-carregar" type="button">Carregar publicações</button>
      <input id="filtro" type="search" placeholder="Filtrar pelo título..." />
    </div>

    <p id="mensagem" role="status"></p>

    <section id="lista-posts" aria-label="Publicações"></section>
  </main>
</body>
</html>
